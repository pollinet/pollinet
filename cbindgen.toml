# cbindgen config for the iOS C header (pollinet.h).
# Regenerated by scripts/build_ios.sh — do not edit the generated header by hand.

language = "C"
include_guard = "POLLINET_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
header = """/*
 * PolliNet iOS FFI — C ABI over the Rust core.
 * Contract: JSON FfiResult envelope ({"ok":true,"data":...} | {"ok":false,"code":...,"message":...}).
 * Every returned char* must be freed with pollinet_string_free();
 * the buffer from pollinet_next_outbound() with pollinet_bytes_free().
 */"""
# The ios cfg is force-enabled inside the header so the pollinet_* surface is
# always visible, while the android cfg stays undefined (hides the JNI decls).
after_includes = "#define POLLINET_IOS 1"

[export]
# Only the C ABI surface — everything exported is prefixed pollinet_.
include = []

[parse]
parse_deps = false

[defines]
# Hide the Android JNI exports (Java_xyz_pollinet_sdk_PolliNetFFI_*) behind a
# define that is never set, and expose everything gated on the ios feature via
# POLLINET_IOS, which `after_includes` defines unconditionally in the header.
# (lib.rs gates `mod ffi` on any(android, ios) — both arms must be mapped or
# cbindgen collapses the guard to just the mapped one.)
"feature = android" = "POLLINET_CBINDGEN_ANDROID_JNI"
"feature = ios" = "POLLINET_IOS"
